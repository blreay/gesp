<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>睿美达环保 - 推文封面模板A 技术产品类 900×383</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 900px;
    height: 383px;
    overflow: hidden;
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: #ffffff;
    position: relative;
  }

  /* ── background layers ── */
  .bg-photo {
    position: absolute;
    inset: 0;
    background: url('../rmd02.jpg') center 40% / cover no-repeat;
  }
  /* white gradient overlay from left */
  .bg-overlay-left {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to right,
      rgba(255,255,255,0.97) 0%,
      rgba(255,255,255,0.94) 35%,
      rgba(255,255,255,0.7) 55%,
      rgba(255,255,255,0.2) 75%,
      rgba(255,255,255,0) 100%
    );
  }
  /* subtle tech pattern */
  .bg-pattern {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle, rgba(49,45,114,0.04) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  /* top purple accent */
  .bg-top-accent {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, #312D72 0%, #312D72 60%, #E8880C 60%, #E8880C 100%);
  }

  /* ── left content ── */
  .content {
    position: absolute;
    top: 5px;
    left: 0;
    bottom: 0;
    width: 500px;
    padding: 30px 24px 24px 40px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 5;
  }

  /* category tag */
  .category {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, #312D72, #4A4494);
    color: white;
    font-size: 11px;
    font-weight: 500;
    padding: 4px 14px;
    border-radius: 3px;
    letter-spacing: 1px;
    width: fit-content;
  }
  .category .icon {
    font-size: 10px;
  }

  /* title area */
  .title-area {
    margin-top: 8px;
  }
  .title-main {
    font-size: 28px;
    font-weight: 900;
    color: #1A1A2E;
    line-height: 1.3;
    letter-spacing: 1px;
  }
  .title-main .em {
    color: #312D72;
    position: relative;
  }
  .title-main .em::after {
    content: '';
    position: absolute;
    bottom: 2px;
    left: 0;
    right: 0;
    height: 6px;
    background: rgba(232,136,12,0.2);
    z-index: -1;
  }
  .title-sub {
    font-size: 14px;
    font-weight: 400;
    color: #6B6B8A;
    margin-top: 8px;
    letter-spacing: 0.5px;
    line-height: 1.5;
  }

  /* data strip */
  .data-strip {
    display: flex;
    gap: 0;
    margin-top: 4px;
  }
  .data-item {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 10px 18px;
    border-right: 1px solid rgba(49,45,114,0.1);
  }
  .data-item:first-child {
    padding-left: 0;
  }
  .data-item:last-child {
    border-right: none;
  }
  .data-item .num {
    font-size: 26px;
    font-weight: 900;
    color: #E8880C;
    line-height: 1;
  }
  .data-item .num .pct {
    font-size: 14px;
  }
  .data-item .desc {
    font-size: 11px;
    color: #888;
    letter-spacing: 0.5px;
    line-height: 1.3;
  }

  /* bottom brand line */
  .brand-line {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 0;
  }
  .brand-line img {
    height: 22px;
    width: auto;
  }
  .brand-line .sep {
    width: 1px;
    height: 16px;
    background: rgba(49,45,114,0.2);
  }
  .brand-line .text {
    font-size: 11px;
    color: #8A87B0;
    letter-spacing: 0.8px;
  }

  /* ── right side decorations ── */
  .right-deco {
    position: absolute;
    top: 5px;
    right: 0;
    bottom: 0;
    width: 120px;
    z-index: 4;
  }
  .pipeline-deco {
    position: absolute;
    right: 30px;
    top: 40px;
    width: 3px;
    height: 200px;
    background: linear-gradient(to bottom, rgba(232,136,12,0.3), rgba(49,45,114,0.3));
    border-radius: 2px;
  }
  .pipeline-deco::before {
    content: '';
    position: absolute;
    top: 60px;
    left: -4px;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: #E8880C;
    opacity: 0.4;
  }
  .pipeline-deco::after {
    content: '';
    position: absolute;
    top: 130px;
    left: -4px;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: #312D72;
    opacity: 0.4;
  }
  /* horizontal pipe branch */
  .pipe-branch {
    position: absolute;
    right: 33px;
    top: 100px;
    width: 40px;
    height: 3px;
    background: rgba(232,136,12,0.2);
    border-radius: 2px;
  }
  .pipe-branch-2 {
    position: absolute;
    right: 33px;
    top: 170px;
    width: 55px;
    height: 3px;
    background: rgba(49,45,114,0.15);
    border-radius: 2px;
  }

  /* ── title placeholder indicator ── */
  .template-hint {
    position: absolute;
    top: 15px;
    right: 16px;
    background: rgba(49,45,114,0.08);
    color: #312D72;
    font-size: 9px;
    padding: 3px 8px;
    border-radius: 3px;
    letter-spacing: 0.5px;
    z-index: 10;
    opacity: 0.6;
  }
</style>
</head>
<body>

  <!-- Background layers -->
  <div class="bg-photo"></div>
  <div class="bg-overlay-left"></div>
  <div class="bg-pattern"></div>
  <div class="bg-top-accent"></div>

  <!-- Template hint -->
  <div class="template-hint">模板A · 技术产品类</div>

  <!-- Main content -->
  <div class="content">

    <div>
      <div class="category">
        <span class="icon">◆</span>
        核心技术
      </div>

      <div class="title-area">
        <div class="title-main">
          <span class="em">超微纳米曝气</span> +<br>
          <span class="em">臭氧催化氧化</span>一体化工艺
        </div>
        <div class="title-sub">
          高效传质 · 深度氧化 · 智能集成<br>
          新一代成套高级氧化水处理解决方案
        </div>
      </div>
    </div>

    <div>
      <div class="data-strip">
        <div class="data-item">
          <span class="num">30<span class="pct">%</span>‑50<span class="pct">%</span></span>
          <span class="desc">节能<br>降耗</span>
        </div>
        <div class="data-item">
          <span class="num">100<span class="pct">%</span></span>
          <span class="desc">出水<br>达标</span>
        </div>
        <div class="data-item">
          <span class="num">24h</span>
          <span class="desc">智能<br>监控</span>
        </div>
      </div>

      <div class="brand-line">
        <img src="../logo.jpg" alt="睿美达">
        <span class="sep"></span>
        <span class="text">北京睿美达环保新材料科技有限公司</span>
      </div>
    </div>

  </div>

  <!-- Right decorations (pipeline motif) -->
  <div class="right-deco">
    <div class="pipeline-deco"></div>
    <div class="pipe-branch"></div>
    <div class="pipe-branch-2"></div>
  </div>

</body>
</html>
